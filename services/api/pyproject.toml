[tool.poetry]
name = "diem10-lichsu-api"
version = "0.1.0"
description = "API for the Điểm 10 Lịch sử learning platform"
authors = ["Điểm 10 Lịch sử"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "*"
uvicorn = { version = "*", extras = ["standard"] }
sqlalchemy = "*"
alembic = "*"
psycopg = { version = "*", extras = ["binary"] }
structlog = "*"
httpx = "^0.28.1"
pyjwt = {extras = ["crypto"], version = "^2.13.0"}

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
ruff = "*"
pyright = "*"
httpx = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
exclude = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
